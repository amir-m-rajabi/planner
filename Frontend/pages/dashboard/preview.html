<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/Frontend/assets/images/Logo.png" type="image/x-icon">
    <link rel="stylesheet" href="/Frontend/css/main.css" />
    <link rel="stylesheet" href="/Frontend/Components/header/header.css" />
    <link rel="stylesheet" href="/Frontend/pages/dashboard/dashboard.css" />
    <link
      rel="stylesheet"
      href="/Frontend/Components/dashboard/timed-activities/timed-activities.css"
    />
    <title>Preview</title>
  </head>
  <body>
    <header class="header">
      <div class="header__container">
        <!-- Logo -->
        <a href="#" class="logo">
          <img
            src="/Frontend/assets/images/Logo.png"
            alt="Planner"
            class="logo__image"
          />
        </a>

        <!-- Navigation -->
        <nav class="navigation" aria-label="منوی اصلی">
          <ul class="navigation__list">
            <li class="navigation__item">
              <a href="#" class="navigation__link navigation__link--active">
                داشبورد
              </a>
            </li>

            <li class="navigation__item">
              <a href="#" class="navigation__link"> فعالیت‌ها </a>
            </li>

            <li class="navigation__item">
              <a href="#" class="navigation__link"> گزارشات </a>
            </li>

            <li class="navigation__item">
              <a href="#" class="navigation__link"> تقویم </a>
            </li>
          </ul>
        </nav>

        <!-- Profile -->
        <a href="#" class="profile">
          <img
            src="/Frontend/assets/images/Profile.jpg"
            alt="پروفایل کاربر"
            class="profile__image"
          />
        </a>
      </div>

      <!-- <div class="auth-actions">
        <a href="#" class="auth-actions__login"> ورود </a>

        <a href="#" class="auth-actions__register"> ثبت‌نام </a>
      </div> -->
    </header>

    <main class="dashboard">
      <div class="dashboard__container">
        <section class="dashboard__layout">
          <!-- Right -->
          <div class="dashboard__activities">
            <section class="dashboard__timed-activities">
              <section class="timed-activities">
                <div class="timed-activities__header">
                  <h2 class="timed-activities__title">فعالیت‌های زمان‌دار</h2>

                  <button
                    type="button"
                    class="timed-activities__add"
                    aria-label="add timed-activity"
                  >
                    +
                  </button>
                </div>

                <div class="timed-activities__content">
                  <div class="timed-activities__list">
                    <article class="timed-activity" data-duration="5720">
                      <div
                        class="timed-activity__indicator"
                        style="--activity-color: #e6b84c"
                      ></div>

                      <div class="timed-activity__info">
                        <h3 class="timed-activity__title">مطالعه ریاضی</h3>

                        <span class="timed-activity__duration"> 01:35:20 </span>
                      </div>

                      <button
                        type="button"
                        class="timed-activity__start"
                        style="--activity-color: #e6b84c"
                      >
                        <span class="timed-activity__start-icon">▶</span>
                        <span>شروع</span>
                      </button>
                    </article>

                    <article class="timed-activity" data-duration="3130">
                      <div
                        class="timed-activity__indicator"
                        style="--activity-color: #4f8fc0"
                      ></div>

                      <div class="timed-activity__info">
                        <h3 class="timed-activity__title">برنامه‌نویسی</h3>

                        <span class="timed-activity__duration"> 00:52:10 </span>
                      </div>

                      <button
                        type="button"
                        class="timed-activity__start"
                        style="--activity-color: #4f8fc0"
                      >
                        <span class="timed-activity__start-icon">▶</span>
                        <span>شروع</span>
                      </button>
                    </article>

                    <article class="timed-activity" data-duration="1900">
                      <div
                        class="timed-activity__indicator"
                        style="--activity-color: #d96b6b"
                      ></div>

                      <div class="timed-activity__info">
                        <h3 class="timed-activity__title">زبان انگلیسی</h3>

                        <span class="timed-activity__duration"> 00:31:40 </span>
                      </div>

                      <button
                        type="button"
                        class="timed-activity__start"
                        style="--activity-color: #d96b6b"
                      >
                        <span class="timed-activity__start-icon">▶</span>
                        <span>شروع</span>
                      </button>
                    </article>

                    <article class="timed-activity" data-duration="1260">
                      <div
                        class="timed-activity__indicator"
                        style="--activity-color: #7fb86a"
                      ></div>

                      <div class="timed-activity__info">
                        <h3 class="timed-activity__title">مطالعه کتاب</h3>

                        <span class="timed-activity__duration"> 00:21:00 </span>
                      </div>

                      <button
                        type="button"
                        class="timed-activity__start"
                        style="--activity-color: #7fb86a"
                      >
                        <span class="timed-activity__start-icon">▶</span>
                        <span>شروع</span>
                      </button>
                    </article>

                    <article class="timed-activity" data-duration="720">
                      <div
                        class="timed-activity__indicator"
                        style="--activity-color: #9b7acb"
                      ></div>

                      <div class="timed-activity__info">
                        <h3 class="timed-activity__title">تمرین پروژه</h3>

                        <span class="timed-activity__duration"> 00:12:00 </span>
                      </div>

                      <button
                        type="button"
                        class="timed-activity__start"
                        style="--activity-color: #9b7acb"
                      >
                        <span class="timed-activity__start-icon">▶</span>
                        <span>شروع</span>
                      </button>
                    </article>
                  </div>
                </div>

                <div class="timed-activities__scroll-hint" aria-hidden="true">
                  <span></span>
                </div>
              </section>
            </section>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
