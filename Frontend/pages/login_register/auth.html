<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/Frontend/css/main.css" />
    <link rel="stylesheet" href="/Frontend/pages/login_register/auth.css" />
    <title>Login | Register</title>
  </head>
  <body>
    <main class="auth-page">
      <!-- Brand Side -->
      <section class="auth-brand">
        <div class="auth-brand__content">
          <div class="auth-brand__logo">Planner</div>

          <h1 class="auth-brand__title">زمانت را بهتر مدیریت کن.</h1>

          <p class="auth-brand__description">
            فعالیت‌ها، زمان و برنامه روزانه‌ات را در یک فضای ساده و منظم مدیریت
            کن.
          </p>

          <!-- Decorative Clock -->
          <div class="auth-brand__clock">
            <div class="auth-clock__numbers">
              <span>00</span>
              <span>06</span>
              <span>12</span>
              <span>18</span>
            </div>

            <div class="auth-clock__center"></div>

            <div class="auth-clock__hand auth-clock__hand--hour"></div>
            <div class="auth-clock__hand auth-clock__hand--minute"></div>
          </div>
        </div>
      </section>

      <!-- Auth Form Side -->
      <section class="auth-panel">
        <div class="auth-card">
          <!-- Header -->
          <div class="auth-card__header">
            <h2 class="auth-card__title">خوش آمدی 👋</h2>

            <p class="auth-card__subtitle">وارد حساب Planner خودت شو.</p>
          </div>

          <!-- Mode Switch -->
          <div class="auth-switch">
            <button
              type="button"
              class="auth-switch__button auth-switch__button--active"
              data-auth-mode="login"
            >
              ورود
            </button>

            <button
              type="button"
              class="auth-switch__button"
              data-auth-mode="register"
            >
              ثبت‌نام
            </button>
          </div>

          <!-- =========================
           Login Form
      ========================== -->

          <form class="auth-form auth-form--login" id="login-form">
            <div class="auth-field">
              <label for="login-email"> ایمیل </label>

              <input
                type="email"
                id="login-email"
                name="email"
                placeholder="example@email.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="auth-field">
              <div class="auth-field__label-row">
                <label for="login-password"> رمز عبور </label>

                <button type="button" class="auth-field__forgot">
                  فراموشی رمز؟
                </button>
              </div>

              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="رمز عبور خود را وارد کنید"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" class="auth-submit">ورود به Planner</button>
          </form>
