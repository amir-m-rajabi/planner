<main class="profile-page">
  <!-- Profile -->
  <section class="profile-card">
    <div class="profile-card__top">
      <div class="profile-avatar">
        <img
          src="/Frontend/assets/images/Profile.jpg"
          alt="تصویر پروفایل"
          class="profile-avatar__image"
        />

        <button
          type="button"
          class="profile-avatar__edit"
          aria-label="تغییر تصویر پروفایل"
          title="تغییر تصویر پروفایل"
        >
          ✎
        </button>
      </div>

      <div class="profile-card__identity">
        <h1 class="profile-card__name">امیرمحمد رجبی</h1>
        <p class="profile-card__city">قزوین، ایران</p>
      </div>
    </div>

    <!-- Personal Information -->
    <div class="profile-form">
      <div class="profile-form__field">
        <label for="first-name">نام</label>

        <input
          type="text"
          id="first-name"
          name="firstName"
          value="امیرمحمد"
          placeholder="نام خود را وارد کنید"
        />
      </div>

      <div class="profile-form__field">
        <label for="last-name">نام خانوادگی</label>

        <input
          type="text"
          id="last-name"
          name="lastName"
          value="رجبی"
          placeholder="نام خانوادگی خود را وارد کنید"
        />
      </div>

      <div class="profile-form__field">
        <label for="province">استان</label>

        <select id="province" name="province">
          <option value="">انتخاب استان</option>

          <option value="alborz">البرز</option>
          <option value="ardabil">اردبیل</option>
          <option value="azarbaijan-east">آذربایجان شرقی</option>
          <option value="azarbaijan-west">آذربایجان غربی</option>
          <option value="bushehr">بوشهر</option>
          <option value="tehran">تهران</option>
          <option value="chaharmahal">چهارمحال و بختیاری</option>
          <option value="south-khorasan">خراسان جنوبی</option>
          <option value="razavi-khorasan">خراسان رضوی</option>
          <option value="north-khorasan">خراسان شمالی</option>
          <option value="khuzestan">خوزستان</option>
          <option value="zanjan">زنجان</option>
          <option value="semnan">سمنان</option>
          <option value="sistan-baluchestan">سیستان و بلوچستان</option>
          <option value="fars">فارس</option>
          <option value="qazvin" selected>قزوین</option>
          <option value="qom">قم</option>
          <option value="kurdistan">کردستان</option>
          <option value="kerman">کرمان</option>
          <option value="kermanshah">کرمانشاه</option>
          <option value="kohgiluyeh">کهگیلویه و بویراحمد</option>
          <option value="golestan">گلستان</option>
          <option value="gilan">گیلان</option>
          <option value="lorestan">لرستان</option>
          <option value="mazandaran">مازندران</option>
          <option value="markazi">مرکزی</option>
          <option value="hormozgan">هرمزگان</option>
          <option value="hamedan">همدان</option>
          <option value="yazd">یزد</option>
        </select>
      </div>

      <div class="profile-form__field">
        <label for="city">شهر</label>

        <select id="city" name="city" disabled>
          <option value="">ابتدا استان را انتخاب کنید</option>
        </select>
      </div>
    </div>

    <button type="button" class="profile-card__save">ذخیره تغییرات</button>
  </section>

  <!-- Account Settings -->
  <section class="settings-card">
    <div class="settings-card__header">
      <h2 class="settings-card__title">تنظیمات حساب</h2>

      <p class="settings-card__subtitle">
        اطلاعات ورود و حساب کاربری خود را مدیریت کنید.
      </p>
    </div>

    <div class="settings-list">
      <!-- Email -->
      <div class="setting-item">
        <div class="setting-item__content">
          <span class="setting-item__title"> ایمیل </span>

          <span class="setting-item__value"> amir.m.rajabi@gmail.com </span>
        </div>

        <button type="button" class="setting-item__action">تغییر</button>
      </div>

      <!-- Password -->
      <div class="setting-item">
        <div class="setting-item__content">
          <span class="setting-item__title"> رمز عبور </span>

          <span class="setting-item__value"> آخرین تغییر: ۲ ماه پیش </span>
        </div>

        <button type="button" class="setting-item__action">تغییر</button>
      </div>

      <!-- Appearance -->
      <div class="setting-item setting-item--appearance">
        <div class="setting-item__content">
          <span class="setting-item__title"> ظاهر برنامه </span>

          <span class="setting-item__value"> حالت روشن </span>
        </div>

        <button
          type="button"
          class="theme-toggle"
          aria-label="تغییر حالت نمایش"
          aria-pressed="false"
        >
          <span class="theme-toggle__icon theme-toggle__icon--light"> ☀ </span>

          <span class="theme-toggle__slider"></span>

          <span class="theme-toggle__icon theme-toggle__icon--dark"> ☾ </span>
        </button>
      </div>
    </div>

    <!-- Logout -->
    <div class="profile-danger">
      <button type="button" class="logout-btn">خروج از حساب</button>
    </div>
  </section>
</main>




<!-- Change Email Modal -->

<div class="profile-modal profile-modal--visible" id="change-email-modal">
  <div class="profile-modal__overlay"></div>

  <div class="profile-modal__box" role="dialog" aria-modal="true">
    <div class="profile-modal__header">
      <div>
        <h2 class="profile-modal__title">تغییر ایمیل</h2>

        <p class="profile-modal__subtitle">ایمیل جدید خود را وارد کنید.</p>
      </div>

      <button type="button" class="profile-modal__close">×</button>
    </div>

    <div class="profile-modal__body">
      <div class="profile-modal__field">
        <label for="new-email"> ایمیل جدید </label>

        <input type="email" id="new-email" placeholder="example@email.com" />
      </div>
    </div>

    <div class="profile-modal__footer">
      <button type="button" class="profile-modal__cancel">انصراف</button>

      <button type="button" class="profile-modal__submit">ذخیره ایمیل</button>
    </div>
  </div>
</div>





<!-- Change Password Modal -->

<div class="profile-modal profile-modal--visible" id="change-password-modal">
  <div class="profile-modal__overlay"></div>

  <div class="profile-modal__box" role="dialog" aria-modal="true">
    <div class="profile-modal__header">
      <div>
        <h2 class="profile-modal__title">تغییر رمز عبور</h2>

        <p class="profile-modal__subtitle">رمز عبور جدید خود را وارد کنید.</p>
      </div>

      <button type="button" class="profile-modal__close">×</button>
    </div>

    <div class="profile-modal__body">
      <div class="profile-modal__field">
        <label for="current-password"> رمز عبور فعلی </label>

        <input
          type="password"
          id="current-password"
          placeholder="رمز عبور فعلی"
        />
      </div>

      <div class="profile-modal__field">
        <label for="new-password"> رمز عبور جدید </label>

        <input type="password" id="new-password" placeholder="رمز عبور جدید" />
      </div>

      <div class="profile-modal__field">
        <label for="confirm-password"> تکرار رمز عبور جدید </label>

        <input
          type="password"
          id="confirm-password"
          placeholder="تکرار رمز عبور جدید"
        />
      </div>
    </div>

    <div class="profile-modal__footer">
      <button type="button" class="profile-modal__cancel">انصراف</button>

      <button type="button" class="profile-modal__submit">
        تغییر رمز عبور
      </button>
    </div>
  </div>
</div>
