<section class="recent-activities">
  <!-- Header -->

  <header class="recent-activities__header">
    <h2 class="recent-activities__title">فعالیت‌های اخیر</h2>
  </header>

  <!-- Sessions -->

  <div class="recent-activities__content">
    <div class="recent-activities__list">
      <!-- Activity Session -->

      <article
        class="recent-activity"
        data-activity-id="1"
        data-session-id="101"
        style="--activity-color: #4f9ea5"
      >
        <div class="recent-activity__main">
          <h3 class="recent-activity__title">برنامه‌نویسی</h3>

          <div class="recent-activity__time">
            <span class="recent-activity__start"> 10:30 </span>

            <span class="recent-activity__separator"> ← </span>

            <span class="recent-activity__end"> 12:15 </span>
          </div>

          <span class="recent-activity__duration"> 1 ساعت و 45 دقیقه </span>
        </div>

        <button
          type="button"
          class="recent-activity__note"
          aria-label="افزودن یادداشت"
          title="افزودن یادداشت"
        >
          +
        </button>
      </article>

      <!-- Activity Session With Note -->

      <article
        class="recent-activity"
        data-activity-id="2"
        data-session-id="102"
        style="--activity-color: #e0a458"
      >
        <div class="recent-activity__main">
          <h3 class="recent-activity__title">مطالعه</h3>

          <div class="recent-activity__time">
            <span class="recent-activity__start"> 14:00 </span>

            <span class="recent-activity__separator"> ← </span>

            <span class="recent-activity__end"> 15:20 </span>
          </div>

          <span class="recent-activity__duration"> 1 ساعت و 20 دقیقه </span>
        </div>

        <button
          type="button"
          class="recent-activity__note recent-activity__note--has-note"
          aria-label="مشاهده یادداشت"
          title="مشاهده یادداشت"
        >
          📖
        </button>
      </article>

      <!-- Activity Session -->

      <article
        class="recent-activity"
        data-activity-id="3"
        data-session-id="103"
        style="--activity-color: #d96b6b"
      >
        <div class="recent-activity__main">
          <h3 class="recent-activity__title">زبان انگلیسی</h3>

          <div class="recent-activity__time">
            <span class="recent-activity__start"> 17:10 </span>

            <span class="recent-activity__separator"> ← </span>

            <span class="recent-activity__end"> 18:00 </span>
          </div>

          <span class="recent-activity__duration"> 50 دقیقه </span>
        </div>

        <button
          type="button"
          class="recent-activity__note"
          aria-label="افزودن یادداشت"
          title="افزودن یادداشت"
        >
          +
        </button>
      </article>
    </div>
  </div>
</section>
